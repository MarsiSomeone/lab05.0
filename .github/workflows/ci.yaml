name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    # Запрещаем использовать кэш
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Clean everything
      run: |
        # Полная очистка перед началом
        git clean -fdx
        git reset --hard HEAD
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential gcovr
    
    - name: Build and test
      run: |
        mkdir build
        cd build
        cmake .. -DBUILD_TESTS=ON -DCOVERAGE=ON
        make -j$(nproc)
        ctest --output-on-failure
    
    - name: Check 100% coverage
      run: |
        cd build
        gcovr --root .. --filter ../Account.cpp --filter ../Transaction.cpp --print-summary
        COVERAGE=$(gcovr --root .. --filter ../Account.cpp --filter ../Transaction.cpp --print-summary 2>/dev/null | grep -oP 'lines: \K\d+')
        if [ "$COVERAGE" != "100" ]; then
          echo "Coverage is $COVERAGE% (100% required)"
          exit 1
        fi
        echo "Code coverage is 100%"
