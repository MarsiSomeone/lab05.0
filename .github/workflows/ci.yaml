name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential gcovr
    
    - name: Build and test
      run: |
        mkdir -p build
        cd build
        cmake .. -DBUILD_TESTS=ON -DCOVERAGE=ON
        make -j$(nproc)
        ctest --output-on-failure
    
    - name: Check coverage
      run: |
        cd build
        gcovr --root .. --filter ../Account.cpp --filter ../Transaction.cpp --print-summary
        COVERAGE=$(gcovr --root .. --filter ../Account.cpp --filter ../Transaction.cpp --print-summary | grep -oP 'lines: \K\d+\.\d+')
        if (( $(echo "$COVERAGE < 100.0" | bc -l) )); then
          echo "Coverage is $COVERAGE% (need 100%)"
          exit 1
        else
          echo "Coverage is $COVERAGE%"
        fi
    
    - name: Generate HTML report
      run: |
        cd build
        gcovr --root .. --filter ../Account.cpp --filter ../Transaction.cpp --html --html-details -o coverage_report.html
        echo "Report saved to build/coverage_report.html"
    
    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build/coverage_report.html
