name: CI

on:
  push:
    branches: [ main, master, br1 ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
   
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Clean everything
      run: |
        git clean -fdx
        git reset --hard HEAD
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential gcovr
    
    - name: Build and test
      run: |
        mkdir build
        cd build
        cmake .. -DBUILD_TESTS=ON -DCOVERAGE=ON
        make -j$(nproc)
        ctest --output-on-failure

    - name: Generate coverage report with genhtml
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info --no-external
        lcov --extract coverage.info "*/Account.cpp" "*/Transaction.cpp" -o coverage_filtered.info
        genhtml coverage_filtered.info --output-directory coverage_report --legend --demangle-cpp --function-coverage --branch-coverage
    

    - name: Check 100% coverage
      run: |
        cd build
        gcovr --root .. --filter ../Account.cpp --filter ../Transaction.cpp --print-summary
        COVERAGE=$(gcovr --root .. --filter ../Account.cpp --filter ../Transaction.cpp --print-summary 2>/dev/null | grep -oP 'lines: \K\d+')
        if [ "$COVERAGE" != "100" ]; then
          echo "Coverage is $COVERAGE% (100% required)"
          exit 1
        else
          echo "Code Coverage is 100%"
        fi

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-html
        path: _build/coverage_report/
